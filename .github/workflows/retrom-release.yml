name: Retrom Core Release
on:
  push:
    tags: ["retrom-core-g5939e0c6d598-r*"]
permissions:
  contents: write
concurrency:
  group: retrom-core-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate annotated release tag
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^retrom-core-g5939e0c6d598-r[1-9][0-9]*(-rc\.[1-9][0-9]*)?$ ]]
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git fetch --no-tags origin '+refs/heads/retrom/g5939e0c6d598:refs/remotes/origin/retrom/g5939e0c6d598'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/retrom/g5939e0c6d598
          python3 .github/rpg-runtime/verify-source.py
      - name: Run regression tests
        run: |
          python3 .github/rpg-runtime/test-release.py
      - name: Build release assets
        run: |
          python3 .github/rpg-runtime/build-release.py \
            --output "$RUNNER_TEMP/np2kai-release" \
            --repository "https://github.com/$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then prerelease+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${prerelease[@]}" --verify-tag --target "$GITHUB_SHA" \
            --title "NP2kai $GITHUB_REF_NAME" --generate-notes "$RUNNER_TEMP/np2kai-release/"*
